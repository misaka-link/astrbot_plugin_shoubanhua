<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>手办化Pro 控制台</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation !important;
        cursor: pointer;
      }
      .font-mono {
        font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular,
          Menlo, Monaco, Consolas, "Liberation Mono", monospace !important;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.35);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.6);
      }
    </style>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var themeVal = params.get("theme");
          var isDark = false;
          if (themeVal === "dark" || params.get("isDark") === "true") {
            isDark = true;
          } else if (themeVal === "light" || params.get("isDark") === "false") {
            isDark = false;
          } else if (localStorage.getItem("astrbot_plugin_theme_is_dark") === "true") {
            isDark = true;
          }
          if (isDark) {
            document.documentElement.style.background = "#000000";
            document.documentElement.style.color = "#ffffff";
          } else {
            document.documentElement.style.background = "#f5f5f5";
            document.documentElement.style.color = "#000000";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
